<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skriz GAME</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; display: flex;
               flex-direction: column; align-items: center; min-height: 100vh; }
  #wrap { display: flex; flex-direction: column; align-items: center; }
  #state { font-size:14px; font-weight:400; margin:0 0 6px; color: #00ff00; }
  #det { font-size:13px; color:#00ff00; margin:0 0 4px; white-space: pre-line; }
  #det b { color:#00ff00; font-weight:600; }
  #cache { font-size:12px; color:#00ff00; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#00ff00; }
  .ok { color:#00ff00; } .bad { color:#ff0000; } .warn { color:#ffff00; }
  #brand { text-align:center; padding:15px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; width: 100%; margin-bottom: 30px; }
  #brand img { width:60px; height:60px; margin-right:12px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:20px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
  
  #terminal {
    background: #000000;
    border: 3px solid #333333;
    border-radius: 0;
    padding: 15px;
    width: 500px;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: #00ff00;
    box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
    position: relative;
  }
  
  #terminal-content {
    text-align: left;
    line-height: 1.6;
  }
  
  #terminal-content > div {
    white-space: pre-wrap;
  }
  

  
  #jailbreak-btn {
    background: #7fd0a0;
    color: #0b0d10;
    border: none;
    padding: 15px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 20px;
    transition: background 0.3s;
  }
  
  #jailbreak-btn:hover {
    background: #6bc088;
  }
  
  #jailbreak-btn:active {
    background: #5ab070;
  }
</style>
</head>
<body>
<div id="brand"><img src="img/logo_skriz.png" alt="Logo">
  <b>Skriz GAME</b>
</div>
<div id="terminal">
  <div id="terminal-content">
    <div id="state">- detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
</div>
<button id="jailbreak-btn">JAILBREAK</button>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var jailbreakBtn = document.getElementById("jailbreak-btn");
    function setState(t, c) { stateEl.textContent = "- " + t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = "- " + t; cacheEl.className = ok ? "cacheok" : ""; }
    var queryString = location.search || "";

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = /(?:\?|&)force=1(?:&|$)/.test(queryString);
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "- Firmware: " + (key || "unknown") + "\n- Status: " + (supported ? "SUPPORTED" : "NOT SUPPORTED");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    // Button click handler
    jailbreakBtn.addEventListener("click", function() {
        if (!supported) {
            setState("UNSUPPORTED FIRMWARE", "bad");
        }
        go();
    });

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        setCache("ready");
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
        }, false);
    }
})();
</script>
</body>
</html>
